name: Deploy Prod

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]

env:
  IMAGE_NAME: dukerupert/a-team-gutters

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            cd ${{ secrets.PROD_VPS_DEPLOY_PATH }}
            export DOCKER_IMAGE=${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            # Persist the deployed tag so a later manual `docker compose up -d`,
            # a reboot, or a container restart reuses this exact image instead of
            # falling back to a stale DOCKER_IMAGE=...:latest line in .env.
            if grep -q '^DOCKER_IMAGE=' .env 2>/dev/null; then
              grep -v '^DOCKER_IMAGE=' .env > .env.tmp
            else
              cat .env 2>/dev/null > .env.tmp || : > .env.tmp
            fi
            printf 'DOCKER_IMAGE=%s\n' "$DOCKER_IMAGE" >> .env.tmp
            chmod 644 .env.tmp
            if mv .env.tmp .env; then
              echo "Recorded DOCKER_IMAGE=$DOCKER_IMAGE in $(pwd)/.env"
            else
              rm -f .env.tmp
              echo "WARNING: could not write $(pwd)/.env; DOCKER_IMAGE not persisted" >&2
            fi
            docker compose pull
            docker compose down || true
            docker compose up -d
