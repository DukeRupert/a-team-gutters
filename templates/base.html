    <!-- Fonts are self-hosted (see @font-face in styles.css), so there is no
         third-party connection on the critical path. Preload only the two
         weights that render above the fold: Barlow Condensed 700 for headings
         and Barlow 400 for body copy. -->
    <link rel="preload" href="/static/fonts/barlow-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{staticHash "/static/css/styles.css"}}">
    {{block "preload" .}}{{end}}
    <!-- Vendored rather than CDN-loaded: pinned versions (the old @3.x.x range
         meant an upstream release could break the site unannounced), no extra
         DNS/TLS handshake, and both are deferred so neither blocks render.
         The collapse plugin must precede Alpine core. htmx is NOT here — only
         the contact form uses it, so that page opts in via the "js" block
         rather than every page paying 51KB for it. -->
    <script defer src="{{staticHash "/static/js/alpine-collapse-3.14.9.min.js"}}"></script>
    <script defer src="{{staticHash "/static/js/alpine-3.14.9.min.js"}}"></script>
    {{block "js" .}}{{end}}

      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DVTPT8GFJX');
    </script>
    <script defer data-domain="ateamgutter.com" src="https://plausible.angmar.dev/js/script.js"></script>
    <!-- Meta Pixel Code -->
    <script>

    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '3627163197422824');
    fbq('track', 'PageView');
    </script>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    {{template "footer" .}}

    <!-- Plausible goal tracking -->
    <script>
        // Track phone call clicks
        document.addEventListener('click', function(e) {
            var link = e.target.closest('a[href^="tel:"]');
            if (link && window.plausible) {
                plausible('Phone Call');
            }
        });

        // Track successful form submissions (HTMX swap means server accepted it)
        document.addEventListener('htmx:afterSwap', function(e) {
            if (e.detail.target.id === 'contact-form-wrap' && e.detail.xhr.status === 200 && window.plausible) {
                plausible('Form Submission');
            }
        });
    </script>
</body>
